<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanken langs je route</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#14171f;background:#fff}
#app{display:grid;grid-template-columns:380px minmax(0,1fr);height:100%}
#side{display:flex;flex-direction:column;border-right:1px solid #d9dce3;overflow:hidden}
header{padding:12px 16px 10px;background:#1240e0;color:#fff;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
header h1{margin:0 0 2px;font-size:18px;line-height:1.2}
header p{margin:0;font-size:12px;opacity:.9}
.lang{display:flex;gap:2px;flex:none;border:1px solid rgba(255,255,255,.6);border-radius:6px;overflow:hidden}
.lang button{min-height:36px;min-width:38px;padding:0 6px;border-radius:0;background:transparent;color:#fff;font-size:13px}
.lang button[aria-pressed=true]{background:#fff;color:#1240e0}
.ctl{padding:10px 16px;border-bottom:1px solid #e3e6ec;display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.ctl label{font-size:12px;color:#4a5060;display:flex;flex-direction:column;gap:3px}
.ctl .full{grid-column:1/-1}
.ctl .row{flex-direction:row;align-items:center;gap:6px;color:#14171f;font-size:13px}
select,input[type=text],input[type=number]{font:inherit;font-size:16px;padding:6px 8px;border:1px solid #c4c9d4;border-radius:4px;background:#fff;color:#14171f;width:100%}
input[type=range]{width:100%;margin:6px 0 0;accent-color:#1240e0}
#maxv{color:#14171f;font-variant-numeric:tabular-nums}
button{font:inherit;font-weight:600;min-height:44px;padding:7px 12px;border:0;border-radius:4px;background:#1240e0;color:#fff;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
#stats{padding:8px 16px;background:#eef2ff;font-size:13px;border-bottom:1px solid #d9dce3}
#stats b{font-variant-numeric:tabular-nums}
#status{padding:6px 16px;font-size:12px;color:#4a5060}
#status.err{color:#b00020;font-weight:600}
#list{overflow:auto;flex:1}
.st{padding:8px 16px;border-bottom:1px solid #eceef2;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:start}
.st:hover,.st.sel{background:#f3f5fb}
.km{font-variant-numeric:tabular-nums;color:#4a5060;font-size:12px;width:44px;padding-top:2px}
.nm{font-weight:600}
.ad{grid-column:2/4;font-size:12px;color:#4a5060}
.pr{font-variant-numeric:tabular-nums;font-weight:700;padding:1px 6px;border-radius:3px;color:#fff;white-space:nowrap}
.old{color:#b00020;font-weight:600}
.tag{display:inline-block;font-size:11px;padding:0 4px;border-radius:3px;background:#e3e6ec;color:#14171f;margin-left:4px;font-weight:600}
.tag.a{background:#1240e0;color:#fff}
#map{height:100%}
.pin{background:none;border:0}
.pin span{display:inline-block;transform:translate(-50%,-50%);padding:1px 5px;border-radius:4px;color:#fff;font:700 12px/1.4 system-ui,sans-serif;white-space:nowrap;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.45)}
.pin.top span{outline:2px solid #14171f}
.leaflet-popup-content{font-size:13px;line-height:1.45}
.leaflet-popup-content table{border-collapse:collapse;margin-top:4px}
.leaflet-popup-content td{padding:1px 8px 1px 0;font-variant-numeric:tabular-nums}
.legend{background:#fff;padding:6px 8px;border-radius:4px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.legend i{display:inline-block;width:120px;height:8px;background:linear-gradient(90deg,#1a9641,#a6d96a,#fdae61,#d7191c);vertical-align:middle;margin:0 4px}
.fuels{display:flex;flex-wrap:wrap;gap:6px}.fuels label{flex-direction:row!important;align-items:center;gap:6px!important;border:1px solid #c4c9d4;border-radius:6px;padding:0 10px;min-height:40px;color:#14171f!important;font-size:14px!important;cursor:pointer}.fuels label:has(input:checked){background:#1240e0;border-color:#1240e0;color:#fff!important}.fuels input{accent-color:#fff}

 filt:'Filter active: {n} stations up to € {p}',fromRoute:'{d} km from route',along:'km {a} of {t}',auto24:'24/7 pay-at-pump',noPrices:'No prices',rupt:'Temporarily out of stock',

const LOC={nl:'nl-BE',fr:'fr-BE',en:'en-GB'};
let lang='nl';
try{lang=localStorage.getItem('tanken-lang')||''}catch(e){}
if(!T[lang]){const n=(navigator.language||'nl').toLowerCase();lang=n.startsWith('fr')?'fr':n.startsWith('nl')?'nl':n.startsWith('en')?'en':'nl'}
const t=(k,p)=>{if(p&&p.lk)p={...p,l:T[lang][p.lk]};return (T[lang][k]??T.nl[k]??k).replace(/\{(\w+)\}/g,(_,x)=>p&&p[x]!=null?p[x]:'')};
const num=(v,d)=>{const s=v.toFixed(d);return lang==='en'?s:s.replace('.',',')};
const fname=k=>k==='gazole'?t('diesel'):{sp95:'SP95',e10:'E10',sp98:'SP98',e85:'E85',gplc:'GPL'}[k];
const FK=['e10','sp95','sp98','gazole','e85','gplc'];
class LocErr extends Error{constructor(k,p){super(t(k,p));this.k=k;this.p=p}}

const map=L.map('map',{preferCanvas:false}).setView([46.3,5.8],8);
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
const esri=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'});
let layerCtl=null;
const legend=L.control({position:'bottomright'});
legend.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.id='legend';return d};
legend.addTo(map);

let routeLayer=null, stationLayer=L.layerGroup().addTo(map), route=null, stations=null, markers={}, maxPrice=null, ends=null, stat=null;

function status(k,p,err){stat={k,p,err};const e=$('status');e.textContent=k?t(k,p):'';e.className=err?'err':''}
function showWhere(){$('where').innerHTML=ends?esc(t('fromS'))+': <b>'+esc(ends[0].name)+'</b><br>'+esc(t('toS'))+': <b>'+esc(ends[1].name)+'</b>':''}

function applyLang(){
  document.documentElement.lang=lang;document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));
  for(const b of $('lang').children)b.setAttribute('aria-pressed',b.dataset.l===lang);
  $('legend').innerHTML=esc(t('cheap'))+'<i></i>'+esc(t('dear'));
  if(layerCtl)map.removeControl(layerCtl);
  layerCtl=L.control.layers({'OpenStreetMap':osm,[t('esri')]:esri}).addTo(map);
  if(routeLayer){try{routeLayer.getLayers()[2].setTooltipContent(t('start'));routeLayer.getLayers()[3].setTooltipContent(t('dest'))}catch(e){}}
  showWhere();render();
}

// plaats → coördinaten: "lat, lon" rechtstreeks, anders opzoeken via OpenStreetMap Nominatim
const geoCache={};
async function locate(s,lk){
  s=s.trim();if(!s)throw new LocErr('empty',{lk});
  const m=s.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if(m){const la=+m[1],lo=+m[2];if(Math.abs(la)>90||Math.abs(lo)>180)throw new LocErr('badCoord',{lk});return{la,lo,name:la.toFixed(5)+', '+lo.toFixed(5)}}
  const key=lang+'|'+s;if(geoCache[key])return geoCache[key];
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language='+lang+'&q='+encodeURIComponent(s));
  if(!r.ok)throw new LocErr('geoFail',{s:r.status});
  const j=await r.json();if(!j.length)throw new LocErr('notFound',{lk,q:s});
  return geoCache[key]={la:+j[0].lat,lo:+j[0].lon,name:j[0].display_name};
}

// Kortste afstand (km) van punt tot polyline + positie langs de route (km), lokale equirectangulaire projectie per punt
function nearest(la,lo,c,cum,bb){
  const k=Math.cos(la*RAD);let best=Infinity,along=0;
  for(let i=1;i<c.length;i++){
    if(bb&&(Math.min(c[i-1][1],c[i][1])-bb.dLa>la||Math.max(c[i-1][1],c[i][1])+bb.dLa<la||Math.min(c[i-1][0],c[i][0])-bb.dLo>lo||Math.max(c[i-1][0],c[i][0])+bb.dLo<lo))continue;
    const ax=(c[i-1][0]-lo)*RAD*k*R,ay=(c[i-1][1]-la)*RAD*R,bx=(c[i][0]-lo)*RAD*k*R,by=(c[i][1]-la)*RAD*R;
    const dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;let tt=L2?-(ax*dx+ay*dy)/L2:0;tt=tt<0?0:tt>1?1:tt;
    const d=Math.hypot(ax+tt*dx,ay+tt*dy);
    if(d<best){best=d;along=cum[i-1]+tt*(cum[i]-cum[i-1])}
  }
  return [best,along];
}

async function load(){
  const btn=$('go');btn.disabled=true;
  try{
    status('sPlaces');
    const A=await locate($('from').value,'fromS'),B=await locate($('to').value,'toS');
    const a=[A.la,A.lo],b=[B.la,B.lo];
    ends=[A,B];showWhere();
    try{localStorage.setItem('tanken-route',JSON.stringify({from:$('from').value,to:$('to').value}))}catch(e){}
    status('sRoute');
    const rr=await fetch(`${OSRM}${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson&steps=true`);
    if(!rr.ok)throw new LocErr('routeHttp',{s:rr.status});
    const rj=await rr.json();
    if(rj.code!=='Ok'||!rj.routes?.length)throw new LocErr('noRoute',{c:rj.code});
    const r0=rj.routes[0],c=r0.geometry.coordinates;
    const cum=[0];for(let i=1;i<c.length;i++){const k=Math.cos((c[i-1][1]+c[i][1])/2*RAD);cum.push(cum[i-1]+R*Math.hypot((c[i][0]-c[i-1][0])*RAD*k,(c[i][1]-c[i-1][1])*RAD))}
    const roads=[...new Set(r0.legs[0].steps.filter(s=>s.distance>15000).map(s=>s.ref||s.name).filter(Boolean))];
    let mnLa=90,mxLa=-90,mnLo=180,mxLo=-180;for(const[lo,la]of c){if(la<mnLa)mnLa=la;if(la>mxLa)mxLa=la;if(lo<mnLo)mnLo=lo;if(lo>mxLo)mxLo=lo}
    route={c,cum,km:r0.distance/1000,min:r0.duration/60,roads};
    if(routeLayer)map.removeLayer(routeLayer);
    routeLayer=L.layerGroup([
      L.polyline(c.map(p=>[p[1],p[0]]),{color:'#fff',weight:8,opacity:.9}),
      L.polyline(c.map(p=>[p[1],p[0]]),{color:'#1240e0',weight:4.5}),
      L.circleMarker([a[0],a[1]],{radius:7,color:'#fff',weight:2,fillColor:'#14171f',fillOpacity:1}).bindTooltip(t('start')),
      L.circleMarker([b[0],b[1]],{radius:7,color:'#fff',weight:2,fillColor:'#14171f',fillOpacity:1}).bindTooltip(t('dest'))
    ]).addTo(map);
    map.fitBounds([[mnLa,mnLo],[mxLa,mxLo]],{padding:[20,20]});

    status('sStations');
    const m=0.15; // ruime marge (~15 km), daarna exacte filtering
    const where=`in_bbox(geom, ${(mnLa-m).toFixed(4)}, ${(mnLo-m).toFixed(4)}, ${(mxLa+m).toFixed(4)}, ${(mxLo+m).toFixed(4)})`;
    const sr=await fetch(API+'?where='+encodeURIComponent(where));
    if(!sr.ok)throw new LocErr('dataHttp',{s:sr.status});
    const raw=await sr.json();
    const bb={dLa:16/111,dLo:16/(111*Math.cos(46*RAD))};
    stations=raw.map(s=>{
      const la=s.geom?.lat??(+s.latitude/1e5),lo=s.geom?.lon??(+s.longitude/1e5);
      if(!isFinite(la)||!isFinite(lo))return null;
      const[d,along]=nearest(la,lo,c,cum,bb);
      return{...s,la,lo,d,along};
    }).filter(s=>s&&s.d<=15);
    const fetchedAt=Date.now();
    stat={k:'fetched',p:null,err:false,at:fetchedAt,n:raw.length};
    render();
  }catch(e){
    console.error(e);
    stat={k:'err',err:true,inner:e.k?{k:e.k,p:e.p}:null,msg:e.message};
    renderStatus();
  }finally{btn.disabled=false}
}
// statusregel opnieuw opbouwen in de gekozen taal
function renderStatus(){
  if(!stat)return;const e=$('status');
  if(stat.k==='fetched'){e.className='';e.textContent=t('fetched',{d:new Date(stat.at).toLocaleString(LOC[lang]),n:stat.n});return}
  if(stat.k==='err'){e.className='err';const i=stat.inner;e.textContent=i&&['empty','badCoord','notFound'].includes(i.k)?t(i.k,i.p):t('err',{m:i?t(i.k,i.p):stat.msg});return}
  e.className=stat.err?'err':'';e.textContent=t(stat.k,stat.p);
}

function color(x){ // 0 = goedkoop, 1 = duur
  const st=[[26,150,65],[166,217,106],[253,174,97],[215,25,28]];
  const y=Math.max(0,Math.min(1,x))*(st.length-1),i=Math.min(st.length-2,Math.floor(y)),f=y-i;
  return 'rgb('+st[i].map((v,j)=>Math.round(v+(st[i+1][j]-v)*f)).join(',')+')';
}
const fmtDate=s=>s?new Date(s).toLocaleString(LOC[lang],{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'–';
const ageDays=s=>s?(Date.now()-new Date(s))/864e5:Infinity;

function render(){
  renderStatus();
  if(!stations||!route){$('maxv').textContent=t('all');return}
  const fs=selFuels(),buf=+$('buf').value||4,only=$('onlySold').checked,noA=$('noAuto').checked;
  // goedkoopste gekozen brandstof per station (bij gelijke prijs telt de volgorde E10, SP95, SP98, Diesel, E85, GPL)
  // prijzen ouder dan de gekozen limiet tellen niet mee (een station met verse SP95 maar oude E10 blijft zo zichtbaar met SP95)
  const maxAge=+$('maxAge').value;
  const best=s=>{let b=null;for(const k of fs){const v=s[k+'_prix'];if(v==null)continue;if(maxAge>0&&ageDays(s[k+'_maj'])>maxAge)continue;if(b===null||v<b.p)b={f:k,p:v,m:s[k+'_maj']}}return b};
  for(const s of stations)s._b=best(s);
  const fnames=fs.map(fname).join(' + ');
  let sel=stations.filter(s=>s.d<=buf&&(!noA||s.pop!=='A'));
  const total=sel.length;
  if(only)sel=sel.filter(s=>s._b);
  sel.sort((x,y)=>x.along-y.along);
  const prices=sel.filter(s=>s._b).map(s=>s._b.p).sort((x,y)=>x-y);
  const lo=prices[0],hi=prices[prices.length-1];
  const med=prices.length?(prices.length%2?prices[(prices.length-1)/2]:(prices[prices.length/2-1]+prices[prices.length/2])/2):null;
  const cheap=new Set(sel.filter(s=>s._b).sort((x,y)=>x._b.p-y._b.p).slice(0,3).map(s=>s.id));
  const tnorm=v=>hi>lo?(v-lo)/(hi-lo):0;

  // prijsfilter: schuif loopt van goedkoopste tot duurste prijs binnen de straal; kleurschaal blijft op alle prijzen gebaseerd
  const sl=$('maxp');
  if(prices.length){
    sl.disabled=false;sl.min=lo.toFixed(3);sl.max=hi.toFixed(3);
    if(maxPrice!=null&&maxPrice>=hi-1e-9)maxPrice=null;
    if(maxPrice!=null&&maxPrice<lo)maxPrice=lo;
    sl.value=(maxPrice??hi).toFixed(3);
  }else{sl.disabled=true;maxPrice=null}
  if(maxPrice!=null)sel=sel.filter(s=>s._b&&s._b.p<=maxPrice+1e-9);
  const shown=sel.filter(s=>s._b).length;
  $('maxv').textContent=maxPrice==null?t('all'):`≤ € ${num(maxPrice,3)} (${shown} ${t('of')} ${prices.length})`;

  $('stats').innerHTML=esc(t('routeLine',{km:num(route.km,1),h:Math.floor(route.min/60),m:String(Math.round(route.min%60)).padStart(2,'0')}))+` · ${esc(route.roads.join(' – '))}<br>`+
    esc(t('nSt',{n:prices.length,f:fnames,b:num(buf,buf%1?1:0)}))+(maxAge>0?esc(t('age',{a:t('d'+maxAge)})):'')+esc(t('ofTot',{t:total}))+
    (prices.length?` · ${t('min')} <b>€ ${num(lo,3)}</b> · ${t('med')} <b>€ ${num(med,3)}</b> · ${t('max')} <b>€ ${num(hi,3)}</b>`:'')+
    (maxPrice!=null?'<br>'+esc(t('filt',{n:shown,p:num(maxPrice,3)})):'');

  stationLayer.clearLayers();markers={};
  for(const s of sel){
    const b=s._b,p=b?b.p:null,has=p!=null,col=has?color(tnorm(p)):'#8a90a0';
    const icon=L.divIcon({className:'pin'+(cheap.has(s.id)?' top':''),html:`<span style="background:${col}">${has?num(p,3)+(fs.length>1?' '+fname(b.f):''):'–'}</span>`,iconSize:[0,0]});
    const rows=FK.filter(k=>s[k+'_prix']!=null).map(k=>`<tr><td>${fname(k)}</td><td><b>€ ${num(s[k+'_prix'],3)}</b></td><td class="${ageDays(s[k+'_maj'])>3?'old':''}">${fmtDate(s[k+'_maj'])}</td></tr>`).join('');
    const rupt=s.carburants_rupture_temporaire?`<div class="old">${esc(t('rupt'))}: ${esc(s.carburants_rupture_temporaire)}</div>`:'';
    const html=`<b>${esc(s.adresse)}</b><br>${esc(s.cp)} ${esc(s.ville)}${s.pop==='A'?' <span class="tag a">A</span>':''}<br>
      ${esc(t('fromRoute',{d:num(s.d,1)}))} · ${esc(t('along',{a:s.along.toFixed(0),t:route.km.toFixed(0)}))}${s.horaires_automate_24_24==='Oui'?' · '+esc(t('auto24')):''}
      <table>${rows||'<tr><td>'+esc(t('noPrices'))+'</td></tr>'}</table>${rupt}
      <a href="https://maps.apple.com/?daddr=${s.la},${s.lo}&amp;dirflg=d" target="_blank" rel="noopener">Apple Maps</a> ·
      <a href="https://www.google.com/maps/dir/?api=1&amp;destination=${s.la},${s.lo}" target="_blank" rel="noopener">Google Maps</a> ·
      <a href="https://www.prix-carburants.gouv.fr/" target="_blank" rel="noopener">prix-carburants.gouv.fr</a> (id ${esc(s.id)})`;
    const mk=L.marker([s.la,s.lo],{icon,zIndexOffset:cheap.has(s.id)?1000:(has?Math.round(1000-tnorm(p)*900):0)}).bindPopup(html,{maxWidth:320}).addTo(stationLayer);
    markers[s.id]=mk;
  }

  $('list').innerHTML=sel.length?sel.map(s=>{
    const b=s._b,p=b?b.p:null,has=p!=null,old=has&&ageDays(b.m)>3;
    return `<div class="st" data-id="${esc(s.id)}">
      <div class="km">km ${s.along.toFixed(0)}</div>
      <div class="nm">${esc(s.ville)}${s.pop==='A'?'<span class="tag a">A</span>':''}${cheap.has(s.id)?'<span class="tag">top 3</span>':''}</div>
      <div><span class="pr" style="background:${has?color(tnorm(p)):'#8a90a0'}">${has?fname(b.f)+' € '+num(p,3):esc(t('na'))}</span></div>
      <div class="ad">${esc(s.adresse)} · ${esc(t('fromRoute',{d:num(s.d,1)}))} · <span class="${old?'old':''}">${has?esc(t('priceOf',{f:fname(b.f),d:fmtDate(b.m)})):''}</span><br><a href="https://maps.apple.com/?daddr=${s.la},${s.lo}&amp;dirflg=d" target="_blank" rel="noopener">Apple Maps</a><a href="https://www.google.com/maps/dir/?api=1&amp;destination=${s.la},${s.lo}" target="_blank" rel="noopener">Google Maps</a></div>
    </div>`}).join(''):'<div style="padding:16px">'+esc(t('none'))+'</div>';
}

$('list').addEventListener('click',e=>{
  if(e.target.closest('a'))return;
  const el=e.target.closest('.st');if(!el)return;
  document.querySelectorAll('.st.sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');
  const mk=markers[el.dataset.id];if(mk){map.setView(mk.getLatLng(),Math.max(map.getZoom(),13));mk.openPopup();if(innerWidth<=760)scrollTo({top:0,behavior:'smooth'})}
});
$('go').addEventListener('click',load);
['from','to'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$(id).blur();load()}}));
$('swap').addEventListener('click',()=>{const f=$('from').value;$('from').value=$('to').value;$('to').value=f;load()});
$('myloc').addEventListener('click',()=>{
  if(!navigator.geolocation){status('noGeo',null,true);return}
  status('locating');
  navigator.geolocation.getCurrentPosition(p=>{$('from').value=p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5);load()},
    e=>status('locFail',{m:e.message},true),{enableHighAccuracy:false,timeout:15000,maximumAge:300000});
});
$('lang').addEventListener('click',e=>{const b=e.target.closest('button[data-l]');if(!b||b.dataset.l===lang)return;lang=b.dataset.l;try{localStorage.setItem('tanken-lang',lang)}catch(x){}applyLang()});
try{const s=JSON.parse(localStorage.getItem('tanken-route')||'null');if(s&&s.from&&s.to){$('from').value=s.from;$('to').value=s.to}}catch(e){}
function selFuels(){const c=[...document.querySelectorAll('#fuels input')];let v=c.filter(x=>x.checked).map(x=>x.value);if(!v.length){c[0].checked=true;v=[c[0].value]}return v}
$('fuels').addEventListener('change',e=>{const c=[...document.querySelectorAll('#fuels input')];if(!c.some(x=>x.checked))e.target.checked=true;maxPrice=null;render()});
['buf','onlySold','noAuto','maxAge'].forEach(id=>$(id).addEventListener('change',render));
$('maxp').addEventListener('input',e=>{maxPrice=+e.target.value;render()});
status('loading');applyLang();
load();
}
</script>
